name: DART 재무·주주 갱신

# 관리자 화면의 [DART 전체 갱신] 버튼이 이 워크플로우를 실행합니다.
# data/insurers.json 을 갱신해 커밋하면 site.yml 의 push 트리거가 재배포합니다.
#
# 필요한 Secrets: DART_API_KEY
# K-ICS 비율과 티커는 건드리지 않습니다 (DART 에 없는 감독지표 / Yahoo 로 검증한 값).

on:
  workflow_dispatch:
    inputs:
      year:
        description: "기준 사업연도 (비우면 최근 2개 연도 순차 시도)"
        required: false
        default: ""
  schedule:
    - cron: "0 1 5 * *"   # 매월 5일 KST 10:00 — 사업보고서 제출 시즌 이후 정기 갱신

concurrency:
  group: dart-sync

permissions:
  contents: write          # data/insurers.json 커밋

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements-dashboard.txt

      - name: DART 갱신
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -n "${{ inputs.year }}" ]; then
            python sync_dart.py --write --year "${{ inputs.year }}"
          else
            python sync_dart.py --write
          fi

      - name: 변경 있으면 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/insurers.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 건너뜀"
          else
            git commit -m "DART 재무·주주 갱신 (자동)"
            git push
          fi
